  '@iconify-json/carbon': ^1.2.19
  '@preact/preset-vite': ^2.10.4
  '@preact/signals': ^2.8.2
  '@tailwindcss/vite': ^4.2.1
  '@types/cross-spawn': ^6.0.6
  '@types/jquery': ^4.0.0
  '@types/node': ^25.5.0
  '@vitejs/plugin-vue': ^6.0.5
  # 与下方 vitest 5.0.3 配套（vitest@5 要求 @vitest/ui@5）
  '@vitest/ui': 5.0.5
  bumpp: ^11.0.1
  canvas-confetti: ^1.9.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cross-spawn: ^7.0.6
  es-toolkit: ^1.45.1
  esno: ^4.8.0
  happy-dom: ^21.0.4
  lint-staged: ^16.4.0
  lucide: ^0.577.0
  lucide-preact: ^0.577.0
  mri: ^1.2.0
  notyf: ^3.10.0
  picocolors: ^1.1.1
  preact: ^10.29.0
  prettier: ^3.8.1
  sass: ^1.98.0
  simple-git-hooks: ^2.13.1
  stylelint: 16.23.1
  stylelint-config-standard: 39.0.0
  stylelint-order: 7.0.0
  stylelint-selector-bem-pattern: 4.0.1
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.2.1
  taze: ^19.10.0
  terser: ^5.46.1
  tw-animate-css: ^1.4.0
  typescript: ^5.9.3
  unocss: ^66.6.6
  unplugin-vue-components: ^31.0.0
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-bundle-analyzer: latest
  vite-plugin-html: ^3.2.2
  vite-plugin-pwa: ^1.2.0
  vite-plugin-singlefile: ^2.3.2
  vite-plugin-svgr: ^4.5.0
  vitest: 5.0.5
  vue: ^3.5.30
  ogl: ^1.0.11
  motion: ^12.38.0
  '@tailwindcss/typography': ^0.5.19
  zx: ^8.8.5
  gradient-string: '^3.0.0'
  vite-plus: latest
  "@base-ui/react": "^1.3.0"
  "@chenglou/pretext": "^0.0.5"

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - simple-git-hooks
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  'postcss-selector-parser@6': '6.1.5'
  # Dependabot 安全告警（2026-11-12）：按大版本顶到已修复的补丁版本
  'brace-expansion@1': '1.1.21'
  'brace-expansion@2': '2.1.7'
  'fast-uri@3': '3.1.9'
  'minimatch@3': '3.1.4'
  'minimatch@5': '5.1.8'
  'js-yaml@4': '4.3.2'
  'nanoid@3': '3.3.20'
  'picomatch@2': '2.3.2'
  'picomatch@4': '4.0.7'
  'source-map-js': '1.2.2'
  'postcss@8': '8.5.31'
  'postcss-selector-parser@7': '7.1.6'
  'colord': '2.9.4'
  'defu@6': '6.1.7'
  'ajv@8': '8.18.0'
  'browserslist@4': '4.28.7'
  'immutable@5': '5.1.8'
  'lodash@4': '4.18.1'
  'rollup@4': '4.59.0'
  'preact@10': '10.29.0'
  '@babel/core@7': '7.29.6'
  'vite@8': '8.1.6'
  '@vitest/browser@5': '5.0.5'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
